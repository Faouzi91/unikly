<main class="recovery-main">
  <section class="recovery-panel" aria-labelledby="recovery-title">
    <h1 id="recovery-title">Forgot your password?</h1>
    <p>Enter the email address you use for Unikly and we will show the available recovery options.</p>
    @if (submitted()) {
      <p class="recovery-note" role="status">Password recovery emails are not set up yet. Please contact the store administrator for help accessing your account.</p>
    }
    <form (ngSubmit)="submit()" #recoveryForm="ngForm">
      <label for="recovery-email">Email address</label>
      <input id="recovery-email" name="email" type="email" autocomplete="email" required maxlength="254"
        [(ngModel)]="email">
      <button type="submit" [disabled]="recoveryForm.invalid">Continue</button>
    </form>
    <a routerLink="/login">Back to sign in</a>
  </section>
</main>
