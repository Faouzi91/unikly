server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        name: UNIKLY_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
      timeout: 30m

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/unikly}
    username: ${DATABASE_USERNAME:unikly_dev}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

unikly:
  email:
    from: ${MAIL_FROM:no-reply@unikly.com}
    public-base-url: ${UNIKLY_PUBLIC_BASE_URL:http://localhost:4200}
